<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Klbko · hlásenia chýb</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#111a33;--muted:#5a6479;--line:#dde3ec;--wool:#b0174f;--soft:#fbe8ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left))}
.wrap{max-width:900px;margin:auto;display:grid;gap:14px}
h1{margin:0;font-size:26px}
form,.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{min-height:42px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;flex:1;min-width:200px}
button{min-height:42px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:8px 14px;font:600 14px inherit;cursor:pointer}
button.main{background:var(--fg);color:#fff;border-color:var(--fg)}
.it{display:grid;gap:6px}.it header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.k{background:var(--soft);color:var(--wool);border-radius:99px;padding:2px 10px;font-weight:700}
.it p{margin:0;white-space:pre-wrap}.it .row{display:flex;gap:8px;justify-content:flex-end}
#st{color:var(--muted)}
</style></head><body><div class="wrap">
<h1>Hlásenia chýb</h1>
<form id="f"><input id="key" type="password" autocomplete="current-password" placeholder="Kľúč správcu (KLBKO_ADMIN_KEY z Vercelu)" aria-label="Kľúč správcu"><button class="main">Načítať</button></form>
<p id="st"></p><div id="list" class="wrap"></div></div>
<script>
const K={obsah:'Obsah',zobrazenie:'Zobrazenie',navrh:'Návrh',ine:'Iné'};
const $=s=>document.querySelector(s),st=$('#st'),list=$('#list');
let key='';try{key=sessionStorage.getItem('klbko-admin')||''}catch(e){}
$('#key').value=key;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){st.textContent='Načítavam…';list.innerHTML='';
 const r=await fetch('/api/hlasenie',{headers:{'x-klbko-admin':key}});const d=await r.json().catch(()=>({}));
 if(!r.ok){st.textContent=d.error||'Chyba načítania.';return}
 st.textContent=d.items.length?`Hlásení: ${d.items.length}`:'Žiadne hlásenia.';
 for(const x of d.items){const c=x.ctx||{},it=document.createElement('article');it.className='it';
  it.innerHTML=`<header><span class="k">${esc(K[x.kind]||x.kind)}</span><span>${esc(new Date(x.at).toLocaleString('sk-SK'))}</span><span>${esc(c.title||'bez témy')}${c.form?' · '+esc(c.form):''}${c.level?' · '+esc(c.level):''}</span>${x.email?`<span>${esc(x.email)}</span>`:''}</header><p>${esc(x.text)}</p><div class="row"><button type="button">Vyriešené, zmazať</button></div>`;
  it.querySelector('button').onclick=async()=>{const r=await fetch('/api/hlasenie?id='+encodeURIComponent(x.id),{method:'DELETE',headers:{'x-klbko-admin':key}});if(r.ok)it.remove();else st.textContent='Zmazanie sa nepodarilo.'};
  list.append(it)}}
$('#f').onsubmit=e=>{e.preventDefault();key=$('#key').value.trim();try{sessionStorage.setItem('klbko-admin',key)}catch(e){}load()};
if(key)load();
</script></body></html>
