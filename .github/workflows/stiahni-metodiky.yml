name: Stiahni metodiky
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stiahni:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nainštaluj pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Stiahni metodiky
        run: node scripts/stiahni-metodiky.mjs
      - name: Zverejni balík metodík
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf metodiky.tar.gz metodiky
          ls -lh metodiky.tar.gz
          gh release create "metodiky-${{ github.run_number }}" metodiky.tar.gz --title "Metodiky Učíme" --notes "Metodické príručky, sprievodcovia a materiály z portálu ucime.vzdelavanie21.sk." --target "${{ github.sha }}"
