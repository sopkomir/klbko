name: Stiahni ŠVP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stiahni:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nainštaluj pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Stiahni dokumenty
        run: node scripts/stiahni-svp.mjs
      - name: Ulož PDF ako prílohu behu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svp-pdf
          path: svp/pdf
          retention-days: 30
      - name: Zverejni balík dokumentov
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf svp-dokumenty.tar.gz svp
          ls -lh svp-dokumenty.tar.gz
          gh release create "svp-${{ github.run_number }}" svp-dokumenty.tar.gz --title "Dokumenty ŠVP" --notes "Stiahnuté oficiálne dokumenty a ich text." --target "${{ github.sha }}"
